<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Treino de Matemática</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  :root { --fundo:#f3f6ff; --cartao:#ffffff; --texto:#2d2a3e; --suave:#7d7a90; --azul:#3a5bd9; --certo:#21a663; --errado:#e0453a; --amarelo:#ffc93c;
    --fonte:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--fundo); color: var(--texto); font-family: var(--fonte); -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    padding: calc(10px + env(safe-area-inset-top,0px)) max(14px, env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px, env(safe-area-inset-left,0px));
    display: flex; flex-direction: column; align-items: center; }
  .wrap { width: 100%; max-width: 620px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  h1 { margin: 0; font-size: 26px; text-align: center; color: var(--azul); }
  .linha { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .op { font: 700 26px var(--fonte); width: 64px; height: 56px; border: 0; border-radius: 14px; background: #dfe5fb; color: var(--azul); cursor: pointer; }
  .op.on { background: var(--azul); color: #fff; }
  .op.mix { width: auto; padding: 0 16px; font-size: 18px; }
  .nivel { font: 600 16px var(--fonte); padding: 8px 14px; border: 0; border-radius: 12px; background: #e9e7f2; color: var(--texto); cursor: pointer; }
  .nivel.on { background: var(--amarelo); }
  .placar { display: flex; justify-content: center; gap: 18px; font-size: 18px; color: var(--suave); }
  .placar b { color: var(--texto); }
  .placar { align-items: center; flex-wrap: wrap; }
  #zerar { font: 600 15px var(--fonte); padding: 6px 14px; border: 0; border-radius: 10px; background: #e9e7f2; color: var(--errado); cursor: pointer; }
  .cartao { background: var(--cartao); border-radius: 24px; padding: 24px 16px; box-shadow: 0 6px 20px rgba(58,91,217,.12); text-align: center; }
  #conta.problema { font-size: min(6.2vw, 26px); font-weight: 600; line-height: 1.4; letter-spacing: 0; text-align: left; }
  .modo { font: 600 17px var(--fonte); padding: 10px 16px; border: 0; border-radius: 12px; background: #e9e7f2; color: var(--texto); cursor: pointer; }
  .modo.on { background: var(--certo); color: #fff; }
  #conta { font-size: min(16vw, 72px); font-weight: 700; letter-spacing: 1px; }
  #msg { min-height: 34px; font-size: 22px; font-weight: 600; margin-top: 6px; }
  #msg.certo { color: var(--certo); } #msg.errado { color: var(--errado); }
  .respostas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .resp { font: 700 min(10vw, 40px) var(--fonte); padding: 18px 0; border: 0; border-radius: 18px; background: #fff; color: var(--texto); box-shadow: 0 3px 0 #cfd6f2; cursor: pointer; }
  .resp.certo { background: var(--certo); color: #fff; box-shadow: none; }
  .resp.errado { background: var(--errado); color: #fff; box-shadow: none; }
  .resp:disabled { cursor: default; }
  #prox { font: 700 22px var(--fonte); padding: 14px; border: 0; border-radius: 16px; background: var(--azul); color: #fff; cursor: pointer; }
  #estrelas { text-align: center; font-size: 24px; min-height: 30px; }
  button:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .fin-topo { display: flex; flex-direction: column; gap: 6px; }
  .fin-barra { height: 14px; background: #e3e7f7; border-radius: 8px; overflow: hidden; }
  .fin-barra div { height: 100%; background: var(--certo); }
  .fin-cont { text-align: center; color: var(--suave); }
  .fin-mod { font-size: 19px; font-weight: 700; color: var(--azul); margin: 10px 0 2px; }
  .fin-lista { display: flex; flex-direction: column; gap: 8px; }
  .fin-item { display: flex; gap: 10px; align-items: center; text-align: left; font: 600 18px var(--fonte); padding: 14px; border: 0; border-radius: 14px; background: #fff; color: var(--texto); box-shadow: 0 2px 0 #d7ddf3; cursor: pointer; }
  .fin-item.trava { opacity: .45; cursor: default; }
  .fin-item.atual { box-shadow: 0 0 0 3px var(--amarelo); }
  .fin-conto { text-align: left; } .fin-conto h2 { margin: 0 0 8px; color: var(--azul); font-size: 22px; } .fin-conto p { font-size: 19px; line-height: 1.55; margin: 0; }
  .fin-num { color: var(--suave); font-size: 14px; margin-bottom: 6px; }
  .fin-p { font-size: 21px; font-weight: 600; line-height: 1.4; }
  #finMsg { margin-top: 10px; font-size: 18px; font-weight: 600; } #finMsg.certo { color: var(--certo); } #finMsg.errado { color: var(--errado); }
  .fin-ops { display: flex; flex-direction: column; gap: 10px; }
  .fin-op { font-size: 19px !important; padding: 14px !important; text-align: left; }
  .fin-acao { font: 700 20px var(--fonte); padding: 14px; border: 0; border-radius: 16px; background: var(--azul); color: #fff; cursor: pointer; }
  .fin-voltar, .fin-zerar { font: 600 16px var(--fonte); padding: 10px; border: 0; border-radius: 12px; background: transparent; color: var(--suave); cursor: pointer; }
  .wrap { overflow-y: auto; }
  body { overflow-y: auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Treino de Matemática</h1>
  <div class="linha" id="modos">
    <button class="modo on" data-m="contas">Contas</button>
    <button class="modo" data-m="problemas">Probleminhas</button>
    <button class="modo" data-m="dinheiro">Dinheiro 💰</button>
  </div>
  <div class="linha" id="ops">
    <button class="op on" data-op="+">+</button>
    <button class="op" data-op="-">−</button>
    <button class="op" data-op="x">×</button>
    <button class="op" data-op="/">÷</button>
    <button class="op mix" data-op="mix">Misturar</button>
  </div>
  <div class="linha" id="niveis">
    <button class="nivel on" data-n="1">Fácil</button>
    <button class="nivel" data-n="2">Médio</button>
    <button class="nivel" data-n="3">Difícil</button>
  </div>
  <div class="placar"><span>Acertos: <b id="acertos">0</b></span><span>Erros: <b id="erros">0</b></span><span>Seguidos: <b id="seq">0</b></span><button id="zerar" type="button">Zerar</button></div>
  <div class="cartao">
    <div id="conta">2 + 3 = ?</div>
    <div id="msg"></div>
  </div>
  <div class="respostas" id="respostas"></div>
  <div id="estrelas"></div>
  <button id="prox" hidden>Próxima conta →</button>
  <div id="fin" hidden style="display:flex;flex-direction:column;gap:12px"></div>
</div>
<script>
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
let modo = "contas", op = "+", nivel = 1, certa = 0, acertos = 0, erros = 0, seq = 0, respondeu = false;
const conta = document.getElementById("conta"), msg = document.getElementById("msg"), resp = document.getElementById("respostas"), prox = document.getElementById("prox");

// Salva onde ela parou (modo, placar e a lição/pergunta do Dinheiro)
let EST = {};
try { EST = JSON.parse(localStorage.getItem("treino_estado") || "{}") || {}; } catch (e) {}
const salvarEst = () => { try { localStorage.setItem("treino_estado", JSON.stringify(EST)); } catch (e) {} };
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
const salvarContas = () => { EST.modo = modo; EST.op = op; EST.nivel = nivel; EST.placar = [acertos, erros, seq]; salvarEst(); };

function gerar() {
  const o = op === "mix" ? ["+","-","x","/"][rnd(0,3)] : op;
  let a, b, r;
  const lim = {1:100, 2:500, 3:1000}[nivel];
  if (o === "+") { a = rnd(nivel === 1 ? 5 : 20, lim); b = rnd(nivel === 1 ? 5 : 20, lim); r = a + b; }
  if (o === "-") { a = rnd(nivel === 1 ? 10 : 50, lim); b = rnd(1, a); r = a - b; }
  if (o === "x") {
    if (nivel === 1) { a = rnd(2, 10); b = rnd(2, 10); }
    else if (nivel === 2) { a = rnd(11, 99); b = rnd(2, 9); }
    else { a = rnd(100, 999); b = rnd(2, 9); if (Math.random() < .4) { a = rnd(11, 99); b = rnd(11, 30); } }
    r = a * b;
  }
  if (o === "/") {
    if (nivel === 1) { b = rnd(2, 10); r = rnd(1, 10); }
    else if (nivel === 2) { b = rnd(2, 9); r = rnd(11, 60); }
    else { b = rnd(3, 12); r = rnd(20, 150); }
    a = b * r;
  }
  const simb = {"+":"+","-":"−","x":"×","/":"÷"}[o];
  if (modo === "problemas") return { texto: problema(o, a, b, r), r, problema: true };
  return { texto: `${a} ${simb} ${b} = ?`, r };
}

const nomes = ["Lara","Lívia","Pedro","Ana","Lucas","Sofia","Miguel","Helena","Theo","Alice"];
const coisas = [["bolacha","bolachas"],["bala","balas"],["figurinha","figurinhas"],["lápis","lápis"],["maçã","maçãs"],["bolinha de gude","bolinhas de gude"],["adesivo","adesivos"],["morango","morangos"],["pirulito","pirulitos"],["carrinho","carrinhos"]];
const caixas = [["caixa","caixas"],["pacote","pacotes"],["saquinho","saquinhos"],["pote","potes"]];
const pick = (arr) => arr[rnd(0, arr.length - 1)];
const pl = (n, c) => n + " " + (n === 1 ? c[0] : c[1]);
function problema(o, a, b, r) {
  let n1 = pick(nomes), n2 = pick(nomes); while (n2 === n1) n2 = pick(nomes);
  const c = pick(coisas), cx = pick(caixas);
  if (o === "+") return pick([
    `${n1} tinha ${pl(a, c)} e ganhou mais ${pl(b, c)} de ${n2}. Com quantas ${c[1]} ${n1} ficou?`,
    `${n1} tem ${pl(a, c)} e ${n2} tem ${pl(b, c)}. Quantas ${c[1]} as duas crianças têm juntas?`,
    `De manhã ${n1} comeu ${pl(a, c)} e de tarde comeu mais ${pl(b, c)}. Quantas ${c[1]} ${n1} comeu no dia?`]);
  if (o === "-") return pick([
    `${n1} tinha ${pl(a, c)} e deu ${pl(b, c)} para ${n2}. Com quantas ${c[1]} ${n1} ficou?`,
    `${n1} tinha ${pl(a, c)} e comeu ${b}. Quantas ${c[1]} sobraram?`,
    `${n1} tem ${pl(a, c)} e ${n2} tem ${pl(b, c)}. Quantas ${c[1]} ${n1} tem a mais que ${n2}?`]);
  if (o === "x") return pick([
    `${n1} comprou ${pl(a, cx)} de ${c[1]}. Cada ${cx[0]} tem ${pl(b, c)}. Quantas ${c[1]} ${n1} comprou ao todo?`,
    `${n1} ganhou ${pl(b, c)} por dia durante ${a} ${a === 1 ? "dia" : "dias"}. Quantas ${c[1]} ganhou no total?`,
    `Na festa tinha ${a} ${a === 1 ? "mesa" : "mesas"} com ${pl(b, c)} em cada uma. Quantas ${c[1]} tinha na festa?`]);
  return pick([
    `${n1} tem ${pl(a, c)} e quer dividir igualmente entre ${b} ${b === 1 ? "amigo" : "amigos"}. Quantas ${c[1]} cada um ganha?`,
    `${n1} tem ${pl(a, c)} e vai guardar ${b} em cada ${cx[0]}. Quantas ${cx[1]} vai precisar?`,
    `A professora tem ${pl(a, c)} para dividir igualmente entre ${b} ${b === 1 ? "criança" : "crianças"}. Quantas ${c[1]} cada criança recebe?`]);
}

function opcoes(r) {
  const passos = [1, 2, 10];
  if (r >= 100) passos.push(100, 20);
  if (r >= 30) passos.push(5);
  const cand = [];
  passos.forEach(p => { cand.push(r + p, r - p); });
  const s = new Set([r]);
  cand.filter(x => x >= 0).sort(() => Math.random() - .5).forEach(x => { if (s.size < 4) s.add(x); });
  while (s.size < 4) s.add(r + s.size * 3);
  return [...s].sort(() => Math.random() - .5);
}

function nova() {
  respondeu = false; prox.hidden = true; msg.textContent = ""; msg.className = "";
  const q = gerar(); certa = q.r; conta.textContent = q.texto; conta.classList.toggle("problema", !!q.problema);
  resp.innerHTML = "";
  opcoes(q.r).forEach(v => {
    const b = document.createElement("button"); b.className = "resp"; b.textContent = v;
    b.onclick = () => responder(b, v); resp.appendChild(b);
  });
}

function responder(btn, v) {
  if (respondeu) return; respondeu = true;
  const botoes = [...resp.children];
  botoes.forEach(b => { b.disabled = true; if (Number(b.textContent) === certa) b.classList.add("certo"); });
  if (v === certa) {
    acertos++; seq++; msg.textContent = ["Muito bem!","Isso aí!","Acertou!","Arrasou!"][rnd(0,3)]; msg.className = "certo";
    if (modo === "contas") conta.textContent = conta.textContent.replace("?", certa);
  } else {
    erros++; seq = 0; btn.classList.add("errado");
    msg.textContent = `Quase! A resposta é ${certa}`; msg.className = "errado";
    if (modo === "contas") conta.textContent = conta.textContent.replace("?", certa);
  }
  document.getElementById("acertos").textContent = acertos;
  document.getElementById("erros").textContent = erros;
  document.getElementById("seq").textContent = seq;
  document.getElementById("estrelas").textContent = "⭐".repeat(Math.min(seq, 10));
  salvarContas();
  prox.hidden = false;
  if (v === certa) setTimeout(() => { if (respondeu) nova(); }, modo === "problemas" ? 2000 : 1200);
}

prox.onclick = nova;
document.getElementById("zerar").onclick = () => {
  acertos = 0; erros = 0; seq = 0;
  document.getElementById("acertos").textContent = 0;
  document.getElementById("erros").textContent = 0;
  document.getElementById("seq").textContent = 0;
  document.getElementById("estrelas").textContent = "";
  salvarContas();
  nova();
};
document.querySelectorAll("#modos .modo").forEach(b => b.onclick = () => {
  document.querySelectorAll("#modos .modo").forEach(x => x.classList.remove("on")); b.classList.add("on"); modo = b.dataset.m; salvarContas(); aplicarModo();
});
document.querySelectorAll("#ops .op").forEach(b => b.onclick = () => {
  document.querySelectorAll("#ops .op").forEach(x => x.classList.remove("on")); b.classList.add("on"); op = b.dataset.op; salvarContas(); nova();
});
document.querySelectorAll("#niveis .nivel").forEach(b => b.onclick = () => {
  document.querySelectorAll("#niveis .nivel").forEach(x => x.classList.remove("on")); b.classList.add("on"); nivel = Number(b.dataset.n); salvarContas(); nova();
});
// ===== Educação financeira =====
const MODULOS = ["🪙 Módulo 1 · Conhecendo o dinheiro", "🛒 Módulo 2 · Fazendo escolhas", "🐷 Módulo 3 · Guardando dinheiro", "🌱 Módulo 4 · Fazendo o dinheiro crescer", "⚠️ Módulo 5 · Cuidado com as dívidas", "🍋 Módulo 6 · Ganhando e empreendendo"];
const L = (m, titulo, conto, perguntas) => ({ m, titulo, conto, perguntas });
const Q = (p, o, c, e) => ({ p, o, c, e });
const LICOES = [
  // ===== MÓDULO 1 =====
  L(0, "Para que serve o dinheiro?",
    "Antigamente não existia dinheiro. Quem tinha galinhas e queria arroz precisava achar alguém que tivesse arroz e quisesse galinhas. Isso se chama TROCA, e era bem difícil! Então as pessoas inventaram o dinheiro: um jeito fácil de trocar qualquer coisa por qualquer coisa.",
    [Q("Antes de existir dinheiro, como as pessoas conseguiam as coisas?", ["Trocando uma coisa por outra", "Pegando nas lojas de graça", "Pedindo para o banco"], 0, "Era a troca: uma galinha por um saco de arroz, por exemplo."),
     Q("Por que o dinheiro facilitou a vida?", ["Porque é colorido", "Porque serve para trocar por qualquer coisa", "Porque não acaba nunca"], 1, "Com dinheiro você não precisa achar alguém que queira suas galinhas."),
     Q("O dinheiro é…", ["Um brinquedo", "Um combinado que todo mundo aceita para trocar coisas", "Um papel sem valor"], 1, "Todo mundo aceita o dinheiro porque combinou que ele vale.")]),
  L(0, "Moedas e notas",
    "A Lara abriu o cofrinho e achou: uma nota de 10 reais, uma nota de 5 reais, duas moedas de 1 real e uma moeda de 50 centavos. Cada real tem 100 centavos. Duas moedas de 50 centavos valem 1 real. Para saber quanto ela tem, é só somar com calma.",
    [Q("Quanto a Lara tem? (10 + 5 + 1 + 1 + 0,50)", ["R$ 17,00", "R$ 17,50", "R$ 16,50", "R$ 18,00"], 1, "10 + 5 = 15, mais 2 reais = 17, mais 50 centavos = R$ 17,50."),
     Q("Quantas moedas de 25 centavos fazem 1 real?", ["2", "4", "5", "10"], 1, "25 + 25 + 25 + 25 = 100 centavos = 1 real."),
     Q("O que vale mais?", ["Uma nota de 20 reais", "Três notas de 5 reais", "Dez moedas de 1 real"], 0, "20 é mais que 15 (três notas de 5) e mais que 10.")]),
  L(0, "O troco",
    "Na cantina, a Lívia comprou um suco de R$ 4,00 e pagou com uma nota de R$ 10,00. A moça devolveu R$ 6,00. Isso é o TROCO: a diferença entre o que você pagou e o que custou. Sempre confira o troco! A conta é de menos: 10 − 4 = 6.",
    [Q("Um lanche custa R$ 7,00. Você paga com R$ 10,00. Qual é o troco?", ["R$ 2,00", "R$ 3,00", "R$ 4,00", "R$ 17,00"], 1, "10 − 7 = 3 reais de troco."),
     Q("Um caderno custa R$ 12,50. Você paga com R$ 20,00. Qual é o troco?", ["R$ 8,50", "R$ 7,50", "R$ 7,00", "R$ 32,50"], 1, "20,00 − 12,50 = R$ 7,50."),
     Q("Por que é importante conferir o troco?", ["Para não perder dinheiro por engano", "Porque é divertido", "Não é importante"], 0, "Todo mundo pode errar. Conferindo, você não perde nada.")]),
  L(0, "De onde vem o dinheiro?",
    "O dinheiro da família vem do TRABALHO. A mamãe pode ser professora, o papai pode ser corretor, o tio pode ser motorista. Cada pessoa faz um trabalho e recebe um SALÁRIO por ele. Esse dinheiro custou horas de esforço, por isso a gente cuida bem dele e não desperdiça.",
    [Q("De onde vem o dinheiro que a família usa?", ["Da maquininha do mercado", "Do trabalho das pessoas", "Cai do céu"], 1, "O dinheiro vem do trabalho."),
     Q("Como se chama o dinheiro que a pessoa recebe pelo trabalho?", ["Troco", "Salário", "Desconto"], 1, "Salário é o pagamento pelo trabalho."),
     Q("Se a mamãe ganha R$ 50 por dia de trabalho, quanto ganha em 5 dias?", ["R$ 55", "R$ 200", "R$ 250", "R$ 500"], 2, "50 × 5 = 250 reais.")]),
  L(0, "O dinheiro invisível: cartão e Pix",
    "Hoje muita gente paga com cartão ou Pix e nem vê o dinheiro. Mas ele existe! Quando o papai passa o cartão de débito ou faz um Pix, o dinheiro sai da conta dele na mesma hora. O dinheiro não aparece na mão, mas acaba do mesmo jeito. Por isso, gastar no cartão é gastar dinheiro de verdade.",
    [Q("Quando pagamos com Pix, o dinheiro…", ["É de graça", "Sai da conta na hora", "Volta no dia seguinte"], 1, "O Pix tira o dinheiro da conta na hora."),
     Q("Gastar no cartão é gastar dinheiro de verdade?", ["Sim", "Não, é só um cartão", "Só às vezes"], 0, "O cartão é só outro jeito de usar o dinheiro."),
     Q("O papai tinha R$ 100 na conta e fez um Pix de R$ 35. Quanto sobrou?", ["R$ 135", "R$ 75", "R$ 65", "R$ 35"], 2, "100 − 35 = 65 reais.")]),
  // ===== MÓDULO 2 =====
  L(1, "Preciso ou quero?",
    "O Pedro foi ao mercado com o pai. Eles precisavam de arroz, leite e pasta de dente. O Pedro viu um brinquedo e quis muito. O pai explicou: arroz, leite e pasta de dente são NECESSIDADES, coisas que a gente precisa para viver bem. O brinquedo é um DESEJO: legal, mas dá para esperar. Primeiro as necessidades, depois os desejos.",
    [Q("Qual destas coisas é uma NECESSIDADE?", ["Videogame novo", "Comida", "Figurinhas", "Sorvete"], 1, "Comida a gente precisa para viver."),
     Q("Qual destas coisas é um DESEJO?", ["Remédio quando está doente", "Material da escola", "Uma boneca nova", "Água"], 2, "A boneca é legal, mas dá para esperar."),
     Q("Se o dinheiro só dá para uma coisa, o que comprar primeiro?", ["O desejo", "A necessidade", "Os dois fiado"], 1, "Primeiro o que precisamos, depois o que queremos.")]),
  L(1, "Escolher é deixar de ter outra coisa",
    "A Helena tinha R$ 20,00. Ela podia comprar um livro ou ir ao cinema, mas não as duas coisas. Escolheu o livro. Então o cinema ficou para depois. Toda vez que escolhemos uma coisa, abrimos mão de outra. Por isso vale pensar: o que eu quero MAIS?",
    [Q("A Helena tinha R$ 20. O livro custa R$ 20 e o cinema também. O que acontece?", ["Ela compra os dois", "Ela escolhe um e abre mão do outro", "O dinheiro dobra"], 1, "Com 20 reais dá para só um dos dois."),
     Q("Antes de gastar, uma boa pergunta é…", ["O que eu quero MAIS?", "Qual é o mais caro?", "O que meu amigo tem?"], 0, "Pensar no que é mais importante ajuda a escolher melhor."),
     Q("Você tem R$ 15. Um sorvete custa R$ 6 e um gibi R$ 10. Dá para os dois?", ["Sim, sobra dinheiro", "Não, falta R$ 1", "Sim, sobra R$ 1"], 1, "6 + 10 = 16. Faltaria 1 real.")]),
  L(1, "Comparando preços",

    [Q("Quanto a Sofia economizou? (18 − 14)", ["R$ 2", "R$ 4", "R$ 14", "R$ 32"], 1, "18 − 14 = 4 reais economizados."),

LICOES.forEach((l,k)=>{ l.titulo = (k+1) + ". " + l.titulo; });

let progresso = 0;
try { progresso = Number(localStorage.getItem("fin_progresso") || 0); } catch (e) {}
const salvarProg = () => { try { localStorage.setItem("fin_progresso", String(progresso)); } catch (e) {} };

const fin = document.getElementById("fin");
function finLista() {
  EST.fin = null; salvarEst();
  const feitas = Math.min(progresso, LICOES.length);
  let h = `<div class="fin-topo"><div class="fin-barra"><div style="width:${feitas / LICOES.length * 100}%"></div></div><div class="fin-cont">${feitas} de ${LICOES.length} lições concluídas</div></div><div class="fin-lista">`;
  LICOES.forEach((l, k) => {
    if (k === 0 || LICOES[k-1].m !== l.m) h += `<div class="fin-mod">${MODULOS[l.m]}</div>`;
    const est = k < progresso ? "feita" : (k === progresso ? "atual" : "trava");
    const icone = est === "feita" ? "✅" : (est === "atual" ? "👉" : "🔒");
    h += `<button class="fin-item ${est}" data-k="${k}" ${est === "trava" ? "disabled" : ""}><span>${icone}</span>${l.titulo}</button>`;
  });
  h += `</div><button class="fin-zerar" id="finZerar">Recomeçar as lições</button>`;
  fin.innerHTML = h;
  fin.querySelectorAll(".fin-item:not([disabled])").forEach(b => b.onclick = () => finConto(Number(b.dataset.k)));
  const zerar = document.getElementById("finZerar");
  let confirmando = false, tempo;
  zerar.onclick = () => {
    if (!confirmando) {
      confirmando = true; zerar.textContent = "Tem certeza? Toque de novo para apagar TODO o progresso"; zerar.style.color = "var(--errado)";
      tempo = setTimeout(() => { confirmando = false; zerar.textContent = "Recomeçar as lições"; zerar.style.color = ""; }, 4000);
      return;
    }
    clearTimeout(tempo); progresso = 0; salvarProg(); finLista();
  };
}
function finConto(k) {
  EST.fin = { k, tela: "conto" }; salvarEst();
  const l = LICOES[k];
  fin.innerHTML = `<div class="cartao fin-conto"><h2>${l.titulo}</h2><p>${l.conto}</p></div>
    <button class="fin-acao" id="finPraticar">Vamos praticar →</button><button class="fin-voltar" id="finVoltar">← Voltar às lições</button>`;
  document.getElementById("finPraticar").onclick = () => finPergunta(k, 0, 0);
  document.getElementById("finVoltar").onclick = finLista;
}
function finPergunta(k, q, acertou) {
  EST.fin = { k, q, acertou, tela: "pergunta" }; salvarEst();
  const l = LICOES[k], pq = l.perguntas[q];
  fin.innerHTML = `<div class="cartao"><div class="fin-num">${l.titulo} · pergunta ${q + 1} de ${l.perguntas.length}</div><div class="fin-p">${pq.p}</div><div id="finMsg"></div></div>
    <div class="fin-ops" id="finOps"></div><button class="fin-acao" id="finProx" hidden></button>`;
  const ops = document.getElementById("finOps");
  pq.o.forEach((t, i) => {
    const b = document.createElement("button"); b.className = "resp fin-op"; b.textContent = t;
    b.onclick = () => {
      [...ops.children].forEach((x, j) => { x.disabled = true; if (j === pq.c) x.classList.add("certo"); });
      const ok = i === pq.c; if (!ok) b.classList.add("errado");
      const m = document.getElementById("finMsg");
      m.className = ok ? "certo" : "errado"; m.textContent = ok ? pq.e : "Quase! " + pq.e;
      const novoAcerto = acertou + (ok ? 1 : 0);
      const prox = document.getElementById("finProx"); prox.hidden = false;
      if (q + 1 < l.perguntas.length) { prox.textContent = "Próxima pergunta →"; prox.onclick = () => finPergunta(k, q + 1, novoAcerto); }
      else { prox.textContent = "Ver resultado →"; prox.onclick = () => finFim(k, novoAcerto); }
    };
    ops.appendChild(b);
  });
}
function finFim(k, acertos) {
  const total = LICOES[k].perguntas.length, passou = acertos >= total - 1;
  if (passou && k === progresso) { progresso = k + 1; salvarProg(); }
  EST.fin = null; salvarEst();
  fin.innerHTML = `<div class="cartao fin-conto"><div style="font-size:56px">${passou ? "🏆" : "💪"}</div>
    <h2>${acertos} de ${total} acertos</h2><p>${passou ? (k + 1 < LICOES.length ? "Parabéns! A próxima lição foi liberada." : "Parabéns! Você completou as 30 lições e já sabe cuidar do seu dinheiro! 🎓") : "Faltou pouquinho! Leia a historinha de novo e tente outra vez."}</p></div>
    <button class="fin-acao" id="finOk">${passou ? "Voltar às lições" : "Tentar de novo"}</button>`;
  document.getElementById("finOk").onclick = passou ? finLista : () => finConto(k);
}

const blocosContas = ["ops","niveis"].map(id=>document.getElementById(id)).concat([document.querySelector(".placar"), document.querySelector(".cartao"), document.getElementById("respostas"), document.getElementById("estrelas")]);
function aplicarModo() {
  const din = modo === "dinheiro";
  blocosContas.forEach(e => e.hidden = din);
  if (din) { prox.hidden = true; fin.hidden = false; finLista(); } else { fin.hidden = true; nova(); }
}

// Ao abrir: volta exatamente onde ela parou
if (["contas", "problemas", "dinheiro"].includes(EST.modo)) modo = EST.modo;
if (["+", "-", "x", "/", "mix"].includes(EST.op)) op = EST.op;
if ([1, 2, 3].includes(EST.nivel)) nivel = EST.nivel;
if (Array.isArray(EST.placar)) { [acertos, erros, seq] = EST.placar.map(n => Number(n) || 0); }
document.getElementById("acertos").textContent = acertos;
document.getElementById("erros").textContent = erros;
document.getElementById("seq").textContent = seq;
document.getElementById("estrelas").textContent = "⭐".repeat(Math.min(seq, 10));
document.querySelectorAll("#modos .modo").forEach(x => x.classList.toggle("on", x.dataset.m === modo));
document.querySelectorAll("#ops .op").forEach(x => x.classList.toggle("on", x.dataset.op === op));
document.querySelectorAll("#niveis .nivel").forEach(x => x.classList.toggle("on", Number(x.dataset.n) === nivel));
const ondeParou = EST.fin;
aplicarModo();
if (modo === "dinheiro" && ondeParou && LICOES[ondeParou.k] && ondeParou.k <= progresso) {
  const l = LICOES[ondeParou.k];
  if (ondeParou.tela === "pergunta" && l.perguntas[ondeParou.q]) finPergunta(ondeParou.k, ondeParou.q, Number(ondeParou.acertou) || 0);
  else finConto(ondeParou.k);
}
</script>
